<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F0E5">
  <title>Faryo Projects</title>
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/pwa-light-192.png">
  <link rel="stylesheet" href="/projects.css?v=deck-3">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Back to Faryo">
        <img class="brand-logo" src="/icons/faryo-mark.png" alt="">
        <span>
          <strong>Faryo</strong>
          <small>Projects</small>
        </span>
      </a>
      <span class="sync" id="syncStatus">Loading</span>
    </header>

    <main>
      <section class="project-list" id="projectList" aria-label="Project deck"></section>
    </main>
  </div>

  <section class="deck-sheet" id="deckSheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="deckTitle">
      <div class="sheet-head">
        <span id="deckMeta">0 / 0</span>
        <h2 id="deckTitle">Deck</h2>
        <button class="icon-btn" type="button" id="deckClose" aria-label="Close">×</button>
      </div>
      <section class="deck-goal" id="deckGoal" hidden>
        <span>Project Goal</span>
        <p id="deckGoalText"></p>
      </section>
      <div class="deck-stage" id="deckStage"></div>
      <div class="deck-nav">
        <button type="button" id="prevCard">Previous</button>
        <button type="button" id="nextCard">Next</button>
      </div>
    </div>
  </section>

  <script src="/projects.js?v=deck-3"></script>
</body>
</html>
