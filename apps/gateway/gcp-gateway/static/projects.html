<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#F7F0E5">
  <title>Faryo Projects</title><link rel="icon" href="/icons/favicon.png"><link rel="apple-touch-icon" href="/icons/pwa-light-192.png"><link rel="stylesheet" href="/projects.css?v=deck-a6">
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand-row"><a class="brand" href="/" aria-label="Back to Faryo"><img class="brand-logo" src="/icons/faryo-mark.png" alt=""><span><strong>Faryo</strong><small>Projects</small></span></a><div class="project-menu" id="projectMenu"><button class="round-menu" id="projectMenuButton" type="button" aria-label="Project menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 12a1.5 1.5 0 1 0 0 .1zm5.5 0a1.5 1.5 0 1 0 0 .1zm5.5 0a1.5 1.5 0 1 0 0 .1z"/></svg></button><div class="project-menu-panel" id="projectMenuPanel" hidden><button class="menu-row" id="archiveFilter" type="button"><span><strong>Show Projects</strong><small id="archiveFilterLabel">Active</small></span><em>↻</em></button></div></div></div><div class="top-actions" aria-label="Project actions"><button class="action-btn import-btn" type="button" id="openImport" title="Import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg><span class="label">Import</span></button><button class="action-btn submit-btn" type="button" id="submitChanges" disabled title="Submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 16-8-6 16-3-7-7-1z"/></svg><span class="label">Submit</span></button><span class="sync action-btn" id="syncStatus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V5h8v2m-9 5h10m-12 8h14V8H5v12zm4-6h6"/></svg><span class="label">Loading</span></span></div></header>
    <main><section class="project-list" id="projectList" aria-label="Project deck"></section></main>
    <section class="controller-dock is-collapsed" id="faryoController" aria-label="Faryo"><button class="controller-pet pet-offline" type="button" id="faryoPet" aria-label="Interrupt Faryo"></button><div class="controller-panel"><button class="controller-bubble" type="button" id="faryoBubble" aria-label="Toggle Faryo input"><span id="faryoActivity">Standing by.</span></button><form class="controller-form" id="faryoForm"><textarea id="faryoPrompt" name="faryo_prompt" rows="1" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea><button type="submit" id="faryoSend">Send</button><button type="button" id="faryoOpen">Open</button></form></div></section>
  </div>
  <section class="deck-sheet" id="deckSheet" hidden><div class="sheet-backdrop" data-close></div><div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="deckTitle"><div class="sheet-head"><div class="sheet-meta" id="deckMeta"></div><h2 id="deckTitle">Deck</h2><button class="icon-btn" type="button" id="deckClose" aria-label="Close">×</button></div><section class="deck-goal" id="deckGoal" hidden><span>Project Goal</span><p id="deckGoalText"></p></section><div class="deck-stage" id="deckStage"></div><div class="deck-nav"><button type="button" id="prevCard">Previous</button><button type="button" id="nextCard">Next</button></div></div></section>
  <section class="deck-sheet" id="importSheet" hidden><div class="sheet-backdrop" data-import-close></div><div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="importTitle"><div class="sheet-head"><div class="sheet-meta"><span class="sheet-badge">Manual</span></div><h2 id="importTitle">Import Project</h2><button class="icon-btn" type="button" data-import-close aria-label="Close">×</button></div><form class="import-form" id="importForm"><label><span>Owner</span><select name="owner_route"><option value="gcp">GCP</option><option value="hp">HP</option><option value="pc">PC</option></select></label><label><span>Project Root</span><input name="project_root" autocomplete="off" placeholder="/home/summer/brain/projects/Asterion"></label><button class="primary import-submit" type="submit">Import</button><p class="import-status" id="importStatus"></p></form></div></section>
  <script src="/projects.js?v=deck-a6"></script>
</body>
</html>
