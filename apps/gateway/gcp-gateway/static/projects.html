<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F0E5">
  <title>Faryo Projects</title>
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/pwa-light-192.png">
  <link rel="stylesheet" href="/projects.css?v=deck-8">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Back to Faryo">
        <img class="brand-logo" src="/icons/faryo-mark.png" alt="">
        <span>
          <strong>Faryo</strong>
          <small>Projects</small>
        </span>
      </a>
      <div class="top-actions">
        <button class="import-btn" type="button" id="openImport">Import</button>
        <button class="submit-btn" type="button" id="submitChanges" disabled>Submit</button>
        <span class="sync" id="syncStatus">Loading</span>
      </div>
    </header>

    <main>
      <section class="project-list" id="projectList" aria-label="Project deck"></section>
    </main>

    <section class="controller-dock is-collapsed" id="faryoController" aria-label="Faryo">
      <button class="controller-pet pet-offline" type="button" id="faryoPet" aria-label="Interrupt Faryo"></button>
      <div class="controller-panel">
        <button class="controller-bubble" type="button" id="faryoBubble" aria-label="Toggle Faryo input">
          <span id="faryoActivity">Standing by.</span>
        </button>
        <form class="controller-form" id="faryoForm">
          <textarea id="faryoPrompt" name="faryo_prompt" rows="1" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea>
          <button type="submit" id="faryoSend">Send</button>
          <button type="button" id="faryoOpen">Open</button>
        </form>
      </div>
    </section>
  </div>

  <section class="deck-sheet" id="deckSheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="deckTitle">
      <div class="sheet-head">
        <span id="deckMeta">0 / 0</span>
        <h2 id="deckTitle">Deck</h2>
        <button class="icon-btn" type="button" id="deckClose" aria-label="Close">×</button>
      </div>
      <section class="deck-goal" id="deckGoal" hidden>
        <span>Project Goal</span>
        <p id="deckGoalText"></p>
      </section>
      <div class="deck-stage" id="deckStage"></div>
      <div class="deck-nav">
        <button type="button" id="prevCard">Previous</button>
        <button type="button" id="nextCard">Next</button>
      </div>
    </div>
  </section>

  <section class="deck-sheet" id="importSheet" hidden>
    <div class="sheet-backdrop" data-import-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <div class="sheet-head">
        <span>Manual</span>
        <h2 id="importTitle">Import Project</h2>
        <button class="icon-btn" type="button" data-import-close aria-label="Close">×</button>
      </div>
      <form class="import-form" id="importForm">
        <label>
          <span>Owner</span>
          <select name="owner_route">
            <option value="gcp">GCP</option>
            <option value="hp">HP</option>
            <option value="pc">PC</option>
          </select>
        </label>
        <label>
          <span>Project Root</span>
          <input name="project_root" autocomplete="off" placeholder="/home/summer/brain/projects/Asterion">
        </label>
        <button class="primary import-submit" type="submit">Import</button>
        <p class="import-status" id="importStatus"></p>
      </form>
    </div>
  </section>

  <script src="/projects.js?v=deck-8"></script>
</body>
</html>
