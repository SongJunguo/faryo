name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/gateway/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Gateway dependencies
        run: python -m pip install --disable-pip-version-check -r apps/gateway/requirements.txt

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected="${TAG_NAME#v}"
          actual="$(awk -F= '$1 == "version" {print $2}' apps/owner/RELEASE | sed 's/^v//')"
          test "$actual" = "$expected"
          test -f "docs/releases/${TAG_NAME}.md"

      - name: Run canonical source checks
        run: |
          FARYO_PYTHON="$(command -v python)" \
          FARYO_NODE_BIN="$(command -v node)" \
            scripts/check-source.sh

      - name: Publish source-only release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG_NAME.md"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Faryo ${TAG_NAME#v}" --notes-file "$notes"
          else
            gh release create "$TAG_NAME" --verify-tag --title "Faryo ${TAG_NAME#v}" --notes-file "$notes"
          fi
